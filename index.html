<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>How to Form Questions · Mylingo</title>
<style>
:root{
  --blue:#58cc02; --blue-dark:#46a302; --blue-soft:#e9f8df;
  --ink:#17212b; --muted:#6b7280; --line:#e5e7eb;
  --bg:#f7f9fc; --card:#fff; --good:#58cc02; --bad:#ff4b4b;
  --shadow:0 10px 30px rgba(23,33,43,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100svh}
body{opacity:0;transition:opacity .32s cubic-bezier(.4,0,.2,1)}
body.ready{opacity:1}
#start,#end{transition:opacity .28s ease}
.brand{cursor:pointer}
.home-link{display:inline-block;margin-top:10px;border:0;background:none;color:var(--muted);font-weight:800;font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
#quizMain{transition:opacity .16s ease}
.blank.filled{color:var(--blue-dark);border-bottom-color:var(--blue-dark);font-weight:900}
button{font:inherit}
#app{min-height:100svh;display:flex;flex-direction:column}
.header{
  position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-left)) 10px;
}
.header-inner{width:min(920px,100%);margin:auto;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.icon-btn{width:40px;height:40px;border:0;background:#f1f3f5;border-radius:50%;cursor:pointer;color:var(--ink);font-size:18px}
.brand{font-weight:900;font-size:16px;letter-spacing:-.2px}
.counter{font-size:12px;font-weight:800;color:var(--muted)}
.progress{height:7px;background:#edf0f3;border-radius:99px;overflow:hidden;margin-top:10px}
.progress>i{display:block;height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .25s ease}
.main{width:min(920px,100%);margin:0 auto;padding:20px 16px calc(28px + env(safe-area-inset-bottom));flex:1}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.badges{display:flex;gap:7px;flex-wrap:wrap}
.badge{padding:7px 10px;border-radius:999px;background:var(--blue-soft);color:#3e8f08;font-size:11px;font-weight:900}
.score{font-weight:900;font-size:14px;color:var(--blue-dark)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:24px 18px;margin-bottom:16px}
.question{font-size:clamp(21px,4vw,30px);line-height:1.35;font-weight:900;letter-spacing:-.45px;text-align:center}
.blank{color:#3e8f08;border-bottom:3px solid var(--blue);padding:0 5px}
.prompt{font-size:12px;text-align:center;color:var(--muted);font-weight:700;margin-top:10px}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.option{
  min-height:58px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px;
  display:flex;align-items:center;gap:10px;text-align:left;font-weight:800;color:var(--ink);
  cursor:pointer;transition:transform .12s,border-color .12s,background .12s,box-shadow .12s;
}
.option:active{transform:scale(.985)}
.option:hover:not(:disabled){border-color:#b9e59e;background:#fbfff8}
.option:disabled{cursor:default}
.key{width:28px;height:28px;border-radius:9px;background:#f0f2f4;color:#66707a;display:grid;place-items:center;
  font-size:11px;font-weight:900;flex:0 0 28px}
.option.correct{border-color:var(--good);background:#effbe9;box-shadow:0 0 0 2px rgba(88,204,2,.08);animation:correctGrow .58s cubic-bezier(.2,.85,.25,1.2) both}
.option.correct .key{background:var(--good);color:#fff;animation:correctKeyPop .5s cubic-bezier(.2,.85,.25,1.25) .04s both}
@keyframes correctGrow{0%{transform:scale(1)}45%{transform:scale(1.045);box-shadow:0 0 0 7px rgba(88,204,2,.12),0 12px 28px rgba(88,204,2,.14)}72%{transform:scale(1.018)}100%{transform:scale(1);box-shadow:0 0 0 2px rgba(88,204,2,.08)}}
@keyframes correctKeyPop{0%{transform:scale(1)}55%{transform:scale(1.16) rotate(-3deg)}100%{transform:scale(1) rotate(0)}}
.option.wrong{border-color:var(--bad);background:#fff0f0;animation:shake .35s}
.option.wrong .key{background:var(--bad);color:#fff}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.feedback{display:none;border-radius:18px;padding:14px 16px;margin-top:14px;font-size:13px;line-height:1.5}
.feedback.show{display:block}
.feedback.good{background:#effbe9;color:#347800;border:1px solid #ccefb8}
.feedback.bad{background:#fff0f0;color:#a52626;border:1px solid #ffc9c9}
.feedback strong{display:block;margin-bottom:4px}
.actions{display:flex;justify-content:center;margin-top:18px}
.next{display:none;border:0;background:var(--blue);color:#fff;font-weight:900;padding:14px 30px;border-radius:999px;box-shadow:0 5px 0 var(--blue-dark);cursor:pointer}
.next.show{display:inline-block}
.footer{text-align:center;color:#9aa1a9;font-size:11px;margin-top:14px}
#start,#end{
  position:fixed;inset:0;z-index:100;background:rgba(255,255,255,.98);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.modal{width:min(520px,100%);text-align:center}
.logo{width:76px;height:76px;border-radius:24px;background:var(--blue);color:#fff;display:grid;place-items:center;
  margin:0 auto 18px;font-size:38px;font-weight:900;box-shadow:0 8px 0 var(--blue-dark)}
.modal h1{font-size:32px;margin:0 0 8px;letter-spacing:-1px}
.modal p{color:var(--muted);line-height:1.55;margin:0 auto 20px;max-width:440px}
.primary{border:0;background:var(--blue);color:#fff;font-weight:900;padding:15px 34px;border-radius:999px;
  box-shadow:0 5px 0 var(--blue-dark);cursor:pointer}
.secondary{margin-top:14px;border:0;background:#f1f3f5;color:var(--ink);font-weight:800;padding:12px 20px;border-radius:999px;cursor:pointer}
.result-ring{width:126px;height:126px;border:10px solid #e8f7df;border-top-color:var(--blue);border-radius:50%;
  display:grid;place-items:center;margin:0 auto 18px}
.result-ring span{font-size:30px;font-weight:900}
#end{display:none}
.small{font-size:12px;color:var(--muted);margin-top:14px}
@media(max-width:620px){
  .main{padding:14px 12px calc(24px + env(safe-area-inset-bottom))}
  .card{padding:20px 14px;border-radius:20px}
  .options{grid-template-columns:1fr}
  .option{min-height:54px}
  .question{font-size:22px}
}
@media(min-width:621px){.main{padding-top:30px}.card{padding:30px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>

Which is the correct Yes/No question for: "She speaks three languages."?	How to form question	Grammar,A2,B1	In the present simple with 'she', use the auxiliary verb 'does' followed by the base verb form.	2	Is she speak three languages?	Does she speak three languages?	Do she speak three languages?	Speaks she three languages?
"______ you finish your assignment last night?"	How to form question	Grammar,A2,B1	The time marker 'last night' indicates past simple, which requires the auxiliary 'did'.	3	Do	Have	Did	Were
Select the grammatically correct present perfect Yes/No question:	How to form question	Grammar,A2,B1	Present perfect questions for experiences use Have + subject (you) + past participle (been).	1	Have you ever been to Japan?	Did you ever been to Japan?	Has you ever been to Japan?	Are you ever been to Japan?
"___ you play the piano?"	How to form question	Grammar,A2,B1	Use the modal verb 'can' directly before the subject to ask about present ability.	2	Are	Can	Do	Will
Choose the past perfect Yes/No question that is correctly structured:	How to form question	Grammar,A2,B1	Past perfect questions require the auxiliary 'had' followed by the subject and past participle.	1	Had the train left when you arrived?	Did the train had left when you arrived?	Was the train left when you arrived?	Have the train left when you arrived?
Select the proper Yes/No question for giving advice with a modal verb:	How to form question	Grammar,A2,B1	Modal verbs like 'should' invert directly with the subject and take a bare infinitive without 'to'.	3	Should to we apologize?	Do we should apologize?	Should we apologize?	Are we should apologize?
"___ they sleeping when you phoned?"	How to form question	Grammar,A2,B1	The past continuous tense for a plural subject ('they') requires the past auxiliary 'were'.	3	Do	Did	Were	Are
Construct a correct Wh- question for: "I live in London."	How to form question	Grammar,A2,B1	Present simple Wh- questions follow: Wh- word + do/does + subject + base verb.	2	Where you live?	Where do you live?	Where live you?	Where are you live?
"He bought a new phone yesterday." -> "What ___?"	How to form question	Grammar,A2,B1	When using the past auxiliary 'did', the main verb must revert to its base form ('buy').	2	did he bought	did he buy	does he buy	he bought
Asking about duration: "___ have you been learning French?"	How to form question	Grammar,A2,B1	Use 'how long' to ask about duration or the period of time an action has lasted.	3	How many	How much	How long	How often
Asking about frequency: "___ do you visit the gym?"	How to form question	Grammar,A2,B1	Use 'how often' to ask about the frequency or regularity of a routine habit.	2	How long	How often	How far	How much
"___ of these shirts do you prefer?"	How to form question	Grammar,A2,B1	Use 'which' when asking a person to make a choice between a limited set of options.	2	What	Which	Who	Whose
Pick the correct formal indirect question for "Where is the station?"	How to form question	Grammar,A2,B1	Indirect questions drop question inversion and use statement word order (subject + verb).	2	Could you tell me where is the station?	Could you tell me where the station is?	Could you tell me where does the station?	Could you tell me where the station does?
Select the correct indirect question for "What time does the movie start?"	How to form question	Grammar,A2,B1	In indirect questions, auxiliary verbs like 'does' are omitted and main verbs conjugate normally.	2	Do you know what time does the movie start?	Do you know what time the movie starts?	Do you know what time starts the movie?	Do you know what time is the movie start?
Choose the correct formal prepositional question:	How to form question	Grammar,A2,B1	In formal English, prepositions like 'to' precede the objective relative pronoun 'whom'.	1	To whom did you give the letter?	To who did you give the letter?	Whom you gave the letter?	Who to did you give the letter?
Select the question inquiring about a price or uncountable quantity:	How to form question	Grammar,A2,B1	Use 'how much' when asking about prices or quantities of uncountable concepts.	2	How many does this cost?	How much does this cost?	How long does this cost?	How far does this cost?
Identify the question asking about physical distance: "___ is it from here to the station?"	How to form question	Grammar,A2,B1	Use 'how far' to ask for geographical or spatial distances.	3	How long	How much	How far	How tall
In the sentence "Mark wrote a book," if we ask about the object, which question is correct?	How to form question	Grammar,A2,B1	Asking about the object ('a book') requires an object question structure using the auxiliary 'did'.	2	What wrote Mark?	What did Mark write?	What Mark wrote?	What was write Mark?
If "Sarah called John," and we want to know who performed the action, which is the correct subject question?	How to form question	Grammar,A2,B1	When asking about the subject performing the action, no auxiliary 'did' is added.	1	Who called John?	Who did call John?	Who did John call?	Who was call John?
The flood caused the damage. Asking about the cause directly, what is the correct question?	How to form question	Grammar,A2,B1	Because 'what' replaces the subject causing the damage, the past verb 'caused' follows directly.	2	What did cause the damage?	What caused the damage?	What did the flood cause?	What cause the damage?
Compare: "Who do you love?" vs "Who loves you?" What is the key difference?	How to form question	Grammar,A2,B1	The presence of 'do' makes the first an object question; the second is a subject question.	2	There is no difference in meaning or grammar structure.	"Who do you love?" is an object question; "Who loves you?" is a subject question.	Both are subject questions, but one is past tense.	"Who do you love?" is a subject question and the other is an object question.
An event happened yesterday. Choose the correct subject question asking about it:	How to form question	Grammar,A2,B1	Subject questions with 'what' take the standard past verb form directly without auxiliary 'did'.	2	What did happen yesterday?	What happened yesterday?	What was happen yesterday?	What did you happen?
Which runner won the race? Is this a subject or an object question?	How to form question	Grammar,A2,B1	'Which runner' acts as the subject that performed the action of winning.	1	Subject question	Object question	Neither subject nor object	A Yes/No question in disguise
Who are you searching for? What grammatical role does "Who" play here?	How to form question	Grammar,A2,B1	'You' is the subject doing the searching, making 'who' the object of the preposition 'for'.	2	Subject	Object	Adverbial modifier	Possessive determiner
Which of the following is an object question about an action performed by Tom?	How to form question	Grammar,A2,B1	The auxiliary 'did' shows Tom is the subject, making it an object question about whom he saw.	2	Who saw Tom?	Who did Tom see?	Who Tom saw?	Who has Tom see?
What went wrong? Is this a subject or an object question?	How to form question	Grammar,A2,B1	'What' serves as the direct subject that did the action of 'going wrong'.	1	Subject question	Object question	Imperative question	Passive tag question
To find out the identity of the person who bought the tickets, which question is correct?	How to form question	Grammar,A2,B1	Asking for the subject identity requires a direct subject question format without auxiliary 'did'.	2	Who did buy the tickets?	Who bought the tickets?	Who did the tickets buy?	Who were buy the tickets?
Complete the clause with the correct question tag: "You are a teacher, ___?"	How to form question	Grammar,A2,B1	Positive statements with 'are' require a corresponding negative tag ('aren't you?').	3	is you?	don't you?	aren't you?	are you?
"She doesn't like seafood, ___?"	How to form question	Grammar,A2,B1	Negative main statements take a positive auxiliary tag ('does she?').	1	does she?	doesn't she?	is she?	isn't she?
"They visited Rome last summer, ___?"	How to form question	Grammar,A2,B1	Positive past simple main verbs require the negative past auxiliary tag 'didn't'.	2	don't they?	didn't they?	weren't they?	did they?
"Let's go for a walk, ___?"	How to form question	Grammar,A2,B1	Suggestions beginning with 'Let's' take the fixed formal tag 'shall we?'.	3	do we?	will you?	shall we?	let us?
"Nobody called me, ___?"	How to form question	Grammar,A2,B1	Negative words like 'nobody' require a positive tag, and take the plural tag pronoun 'they'.	1	did they?	didn't they?	did it?	didn't he?
"I am correct, ___?"	How to form question	Grammar,A2,B1	Statements starting with 'I am' always use the special contracted question tag 'aren't I?'.	3	am not I?	aren't I am?	aren't I?	ain't I?
"You've bought a new phone, ___?"	How to form question	Grammar,A2,B1	The verb 'have' acts as the auxiliary verb in 'have got/bought', taking the tag 'haven't you?'.	2	do you?	haven't you?	have you?	did you?
"That's your final choice, ___?"	How to form question	Grammar,A2,B1	The demonstrative pronoun 'that' converts to the personal pronoun 'it' inside question tags.	2	isn't that?	isn't it?	is it?	aren't they?
"You wouldn't reveal our secret, ___?"	How to form question	Grammar,A2,B1	Negative modal statements using 'wouldn't' invert to form positive tags ('would you?').	2	wouldn't you?	would you?	did you?	do you?
"You rarely study late, ___?"	How to form question	Grammar,A2,B1	Negative adverbs like 'rarely' make the statement negative, requiring a positive tag ('do you?').	2	don't you?	do you?	rarely you?	aren't you?
"___ you listening to the speaker right now?"	How to form question	Grammar,A2,B1	The present continuous question structure for 'you' begins with the auxiliary 'Are'.	1	Are	Do	Have	Is
"___ it snowing when you departed?"	How to form question	Grammar,A2,B1	Third-person singular subjects ('it') in past continuous require 'Was'.	1	Was	Were	Did	Is
"___ she finished her project yet?"	How to form question	Grammar,A2,B1	Third-person singular subjects in present perfect require the auxiliary 'Has'.	1	Has	Have	Is	Did
"___ we leave our coats here?"	How to form question	Grammar,A2,B1	Use 'May' or 'Can' to ask permission in modal questions.	1	May	Are	Do	Have
"___ they at the conference yesterday?"	How to form question	Grammar,A2,B1	The past simple of 'be' for the plural subject 'they' is 'Were'.	1	Were	Was	Did	Are
"___ your sister work in Kumasi?"	How to form question	Grammar,A2,B1	Singular noun subjects ('your sister') take 'Does' in present simple questions.	1	Does	Do	Is	Are
"___ the message sent yesterday?"	How to form question	Grammar,A2,B1	Past simple passive questions begin with 'Was/Were' + subject + past participle.	1	Was	Did	Has	Is
Choose the correct future simple Yes/No question: "___ you attend the seminar tomorrow?"	How to form question	Grammar,A2,B1	Future simple questions with decisions or predictions use 'Will'.	1	Will	Do	Are	Have
Form a Yes/No question using 'have to' for obligation: "___ we have to wear a suit?"	How to form question	Grammar,A2,B1	Questions with 'have to' require the auxiliary 'Do/Does/Did'.	1	Do	Are	Have	Must
Which question asking about a habitual past state is correct? "___ you use to live in Sunyani?"	How to form question	Grammar,A2,B1	Questions with 'used to' require 'Did' + subject + 'use to'.	1	Did	Were	Have	Had
Form a Wh- question inquiring about a reason: "___ are you leaving so early?"	How to form question	Grammar,A2,B1	Use 'Why' to ask for reasons or explanations.	1	Why	What	Where	How
Select the correct question asking about ownership: "___ coat is this on the chair?"	How to form question	Grammar,A2,B1	Use 'Whose' to ask about possession or ownership.	1	Whose	Who	Which	Where
"___ do you prepare this meal?"	How to form question	Grammar,A2,B1	Use 'How' to ask about method, process, or manner.	1	How	What	Why	Where
Form a Wh- question asking for a person's identity: "___ is the principal of the school?"	How to form question	Grammar,A2,B1	Use 'Who' when asking about the identity of a person.	1	Who	Whose	Which	What
Select the Wh- question inquiring about time: "___ does the flight land?"	How to form question	Grammar,A2,B1	Use 'When' or 'What time' to inquire about temporal points.	1	When	Where	Why	Which
Which question correctly asks about a specific choice? "___ color do you want, green or blue?"	How to form question	Grammar,A2,B1	Use 'Which' when choosing between explicit options.	1	Which	What	Whose	How
Select the correct indirect question: "Do you know where ___?"	How to form question	Grammar,A2,B1	Indirect question clauses maintain subject + verb word order.	1	the bank is	is the bank	does the bank stay	is located the bank
Select the correct indirect question: "Could you tell me what time ___?"	How to form question	Grammar,A2,B1	Avoid using auxiliary inversion inside indirect question clauses.	1	the shop opens	does the shop open	opens the shop	is opening the shop
Form an indirect question: "I wonder why ___ so upset yesterday."	How to form question	Grammar,A2,B1	Keep normal clause word order (subject + past verb) in embedded questions.	1	he was	was he	did he be	he did
Choose the correct formal question format: "___ were you speaking to just now?"	How to form question	Grammar,A2,B1	When prepositions are at the end, 'Who' is used informally; 'Whom' is used formally.	1	Whom	Whose	Which	What
Someone stole my bag. Which is the correct subject question asking for the culprit?	How to form question	Grammar,A2,B1	Subject questions replace the missing subject directly without adding 'did'.	1	Who stole your bag?	Who did steal your bag?	Who did your bag steal?	What stole your bag?
The manager praised Yaw. Which is the correct object question asking who was praised?	How to form question	Grammar,A2,B1	Asking about the object of praise requires auxiliary 'did' before the subject.	1	Who did the manager praise?	Who praised the manager?	Who praise the manager?	Whose manager praised?
Which train goes to Accra? Is this a subject or object question?	How to form question	Grammar,A2,B1	'Which train' is performing the action of going, making it a subject question.	1	Subject question	Object question	Indirect question	Tag question
What did you order at the restaurant? Is this a subject or object question?	How to form question	Grammar,A2,B1	'You' is the subject ordering, so 'what' is the object being ordered.	2	Subject question	Object question	Confirmation question	Imperative sentence
Who created this piece of art? Which structural explanation is correct?	How to form question	Grammar,A2,B1	It is a subject question because 'Who' is the subject performing the creation.	1	Subject question without auxiliary did	Object question with missing auxiliary	Indirect question clause	Passive Voice question

function playWrongSound(){
  // Built-in Web Audio wrong-answer effect: no extra file is needed.
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    const ctx = new C();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(90, now + 0.24);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.16, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.3);
    setTimeout(()=>{try{ctx.close()}catch(e){}},450);
  } catch(e) {}
}

/* ---------- APP CONFIG ---------- */
const CONFIG = {
  title: 'English Practice',
  shuffleQuestions: false,
  shuffleAnswers: true,
  autoFullscreen: true,
  showExplanation: true,
  keyboardShortcuts: true
};

/* ---------- TSV ENGINE ---------- */
function parseTSV(text){
  const lines = text.replace(/\r/g,'').split('\n').filter(line => line.trim());
  if(!lines.length) return [];
  const headers = splitTSV(lines[0]).map(clean);
  return lines.slice(1).map(line => {
    const values = splitTSV(line);
    const row = {};
    headers.forEach((h,i) => row[h] = clean(values[i] ?? ''));
    return row;
  }).filter(row => row['Question']);
}
function splitTSV(line){
  const out=[]; let cur=''; let quoted=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c === '"'){
      if(quoted && line[i+1] === '"'){cur+='"';i++;continue;}
      quoted=!quoted; continue;
    }
    if(c === '\t' && !quoted){out.push(cur);cur='';}
    else cur+=c;
  }
  out.push(cur); return out;
}
function clean(v){return String(v).trim().replace(/^"(.*)"$/,'$1');}

function makeQuestions(){
  const rows = parseTSV(document.getElementById('embedded-tsv').textContent);
  return rows.map((r,n)=>{
    const optionKeys = Object.keys(r).filter(k => /^Answer \d+$/i.test(k))
      .sort((a,b)=>Number(a.match(/\d+/)[0])-Number(b.match(/\d+/)[0]));
    const options = optionKeys.map(k=>r[k]).filter(Boolean);
    const correctIndex = Math.max(0, Number(r['Correct answer (Index)'] || 1)-1);
    return {
      id:n+1,
      question:r['Question'] || '',
      category:r['Category'] || r['Topic'] || 'Practice',
      level:r['Level'] || r['Tags'] || '',
      explanation:r['Question explanation'] || r['Explanation'] || '',
      options,
      correct: options[correctIndex] ?? options[0]
    };
  }).filter(q=>q.question && q.options.length >= 2);
}

/* ---------- STATE ---------- */
let questions = makeQuestions();
let current = 0;
let score = 0;
let answered = false;
let shuffledOptions = [];

const $ = id => document.getElementById(id);
/* ---------- MYLINGO SHARED PROGRESS ---------- */
const QUIZ_CONFIG=JSON.parse(document.getElementById('quiz-config')?.textContent||'{}');
const MYLINGO_PROGRESS_KEY='mylingo.progress.v1';
const QUIZ_ID=QUIZ_CONFIG.id||location.pathname.split('/').pop().replace(/\.html$/,'')||'quiz';
function mp(){try{return JSON.parse(localStorage.getItem(MYLINGO_PROGRESS_KEY)||'{}')}catch(e){return{}}}
function saveMP(completed=false){try{const a=mp(),p=a[QUIZ_ID]||{},pct=questions.length?Math.round(score/questions.length*100):0;const now=Date.now();a[QUIZ_ID]={id:QUIZ_ID,title:QUIZ_CONFIG.title||CONFIG.title,category:questions[0]?.category||'Other',level:levelOf(questions[0]?.level||''),lastAccess:now,status:completed?'completed':(current||score?'in-progress':'new'),current:completed?questions.length:current,score,latest:completed?pct:(p.latest??null),best:completed?Math.max(p.best||0,pct):(p.best??null),attempts:completed?(p.attempts||0)+1:(p.attempts||0),completedAt:completed?now:(p.completedAt||null),version:2};localStorage.setItem(MYLINGO_PROGRESS_KEY,JSON.stringify(a));}catch(e){}}
function levelOf(t){const m=String(t).match(/\b(A1|A2|B1|B2|C1|C2)\b/i);return m?m[1].toUpperCase():'Other'}
function resumeMP(){const p=mp()[QUIZ_ID];if(p?.status==='in-progress'&&p.current<questions.length){current=p.current;score=p.score||0;return true}return false}


/* ---------- FULLSCREEN ---------- */
async function enterFullscreen(){
  try{
    if(document.fullscreenElement) return true;
    if(document.documentElement.requestFullscreen){
      await document.documentElement.requestFullscreen();
      return true;
    }
  }catch(e){}
  return false;
}
function leaveFullscreen(){
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
}

/* Browsers, especially iOS Safari, may block automatic fullscreen.
   The first user tap on Start/Foc​us Mode retries it. */
window.addEventListener('load', ()=>{
  if(CONFIG.autoFullscreen) setTimeout(enterFullscreen,250);
});

/* ---------- QUIZ ---------- */
function start(){
  questions = makeQuestions();
  if(!questions.length){
    $('startInfo').textContent='No valid questions were found in the embedded TSV.';
    $('startBtn').disabled=true;
    return;
  }
  if(CONFIG.shuffleQuestions){
    questions = [...questions].sort(()=>Math.random()-.5);
  }
  const resumed=resumeMP(); if(!resumed){current=0;score=0;}
  $('score').textContent=String(score);
  hideOverlay($('start'));
  hideOverlay($('end'));
  saveMP(false);
  enterFullscreen();
  render();
}
function hideOverlay(el){
  if(el.style.display==='none') return;
  el.style.opacity='0';
  setTimeout(()=>{ el.style.display='none'; el.style.opacity=''; },280);
}
function showOverlay(el){
  el.style.display='flex';
  el.style.opacity='0';
  requestAnimationFrame(()=>{ el.style.opacity='1'; });
}
function goHome(){
  document.body.style.opacity='0';
  setTimeout(()=>{ location.href='./index.html'; },260);
}
function render(){
  const q=questions[current];
  answered=false;
  $('counter').textContent=`${current+1} / ${questions.length}`;
  $('progressBar').style.width=`${((current)/questions.length)*100}%`;
  $('categoryBadge').textContent=q.category || 'Practice';
  $('levelBadge').textContent=q.level || 'Practice';
  $('question').innerHTML=makeQuestionHTML(q.question);
  $('feedback').className='feedback';
  $('feedback').innerHTML='';
  $('nextBtn').className='next';

  shuffledOptions=[...q.options];
  if(CONFIG.shuffleAnswers) shuffledOptions.sort(()=>Math.random()-.5);

  const box=$('options'); box.innerHTML='';
  shuffledOptions.forEach((option,i)=>{
    const b=document.createElement('button');
    b.className='option';
    b.innerHTML=`<span class="key">${i+1}</span><span>${escapeHTML(option)}</span>`;
    b.addEventListener('click',()=>answer(option,b));
    box.appendChild(b);
  });
}
function makeQuestionHTML(text){
  const safe=escapeHTML(text);
  return safe.replace(/______+/g,'<span class="blank">______</span>');
}
function fillBlank(html,answerText){
  return html.replace(/<span class="blank">______<\/span>/g,`<span class="blank filled">${escapeHTML(answerText)}</span>`);
}
function answer(selected,button){
  if(answered) return;
  answered=true;
  const q=questions[current];
  document.querySelectorAll('.option').forEach(b=>b.disabled=true);
  document.querySelectorAll('.option').forEach(b=>{
    const value=b.querySelector('span:last-child').textContent;
    if(value===q.correct) b.classList.add('correct');
  });
  const correct=selected===q.correct;
  $('question').innerHTML=fillBlank($('question').innerHTML,q.correct);
  if(correct){
    playCorrectSound();
    score++;
    button.classList.add('correct');
    showFeedback(true,'Correct!', q.explanation);
  }else{
    playWrongSound();
    button.classList.add('wrong');
    showFeedback(false,`Not quite. The best answer is “${q.correct}”.`, q.explanation);
  }
  $('score').textContent=score;
  saveMP(false);
  $('progressBar').style.width=`${((current+1)/questions.length)*100}%`;
  $('nextBtn').className='next show';
  $('nextBtn').textContent=current===questions.length-1?'See results':'Continue';
}
function showFeedback(good,title,explanation){
  const f=$('feedback');
  f.className='feedback show '+(good?'good':'bad');
  f.innerHTML=`<strong>${escapeHTML(title)}</strong>${CONFIG.showExplanation && explanation && explanation!=='-' ? escapeHTML(explanation):''}`;
}
function next(){
  if(!answered) return;
  if(current>=questions.length-1){finish();return;}
  current++;
  saveMP(false);
  const m=$('quizMain');
  m.style.opacity='0';
  setTimeout(()=>{ render(); m.style.opacity='1'; },170);
  window.scrollTo({top:0,behavior:'smooth'});
}
function finish(){
  const pct=Math.round((score/questions.length)*100);
  $('finalPct').textContent=pct+'%';
  $('endTitle').textContent=pct===100?'Perfect score!':pct>=80?'Excellent work!':pct>=60?'Good progress!':'Keep practicing!';
  $('endMsg').textContent=`You got ${score} out of ${questions.length} questions correct.`;
  saveMP(true);
  showOverlay($('end'));
}
function restart(){
  hideOverlay($('end'));
  start();
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

/* ---------- EVENTS ---------- */
$('startBtn').addEventListener('click',start);
$('focusBtn').addEventListener('click',()=>{enterFullscreen();start();});
$('nextBtn').addEventListener('click',next);
$('againBtn').addEventListener('click',restart);
$('exitBtn').addEventListener('click',()=>{
  leaveFullscreen();
  hideOverlay($('end'));
  showOverlay($('start'));
});
$('brandHome').addEventListener('click',goHome);
$('homeBtnStart').addEventListener('click',goHome);
$('homeBtnEnd').addEventListener('click',goHome);
document.addEventListener('keydown',e=>{
  if(!CONFIG.keyboardShortcuts || $('start').style.display!=='none' || $('end').style.display==='flex') return;
  if(e.key>='1' && e.key<='9' && !answered){
    const i=Number(e.key)-1;
    const btn=document.querySelectorAll('.option')[i];
    if(btn) btn.click();
  }else if(e.key==='Enter' && answered) next();
});

/* ---------- STUDENT-FRIENDLY STATUS ---------- */
$('startInfo').textContent =
  `${questions.length} questions are ready. Your teacher has already loaded the practice set — just start.`;
requestAnimationFrame(()=>document.body.classList.add('ready'));
</script>
</body>
